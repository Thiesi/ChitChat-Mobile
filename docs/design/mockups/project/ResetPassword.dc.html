<div class="ccm light">

  <div class="appbar">

    <span style="display: inline-flex; gap: 8px; align-items: center; background: var(--raised); border-radius: 18px; padding: 4px 12px 4px 4px; font-size: 14px;">

    <p style="margin: 0; font-size: 14px; color: var(--text-2);">Use the recovery key you saved when you created your account or last reset your password. No key? Only the people who run Schmidt Family Chat can reset it.</p>
    <div><label class="label" for="u">Username</label><input id="u" class="input" value="mara"></div>
    <div><label class="label" for="k">Recovery key</label><input id="k" class="input focus" value="a7k2 9qmx t4wb h8r3 zc6n p1vd" style="font-family: ui-monospace, monospace;"><div class="hint" style="margin: 4px 0 0;">Upper or lower case, with or without dashes.</div></div>
    <div><label class="label" for="n">New password</label><input id="n" class="input" type="password" value="correct horse battery"></div>
    <div><label class="label" for="c">Confirm new password</label><input id="c" class="input" type="password" value="correct horse battery"></div>
    <div style="display: flex; gap: 10px; align-items: center; font-size: 14px;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text);"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Ready</div>
    <span class="spacer"></span>
  </div>
  <div style="padding: 0 24px 28px; display: flex; flex-direction: column; gap: 8px;">
    <a class="btn" href="RecoveryKey.dc.html" style="width: 100%;">Reset password</a>
    <a class="btn text" href="SignIn.dc.html" style="color: var(--text);">Back to sign in</a>
