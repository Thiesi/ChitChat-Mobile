<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files in a room</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lantern.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.img{width:210px;height:280px;border-radius:14px;background:linear-gradient(135deg,#7FD1C1,#8DB8F5 60%,#F5C451);margin:-2px -6px 6px}
.ph{width:260px;height:146px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:-2px -6px 6px;font-size:13px;color:var(--text-2)}
.file{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin:-2px -6px 6px;width:250px}
.fi{width:40px;height:40px;border-radius:10px;background:var(--honey-wash);display:flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:800;color:var(--ink)}
.card{margin:0 10px 6px;border-radius:16px;padding:8px 10px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line)}
.ring{width:40px;height:40px;border-radius:20px;border:4px solid var(--raised);border-top-color:var(--persimmon);border-right-color:var(--persimmon);flex:none}
</style>
</helmet>
<div class="ccm light">
  <div class="inset"></div>
  <div class="appbar" style="padding-left: 4px; gap: 8px; border-bottom: 1px solid var(--line);">
    <a class="icon-btn" href="Home.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="tile sm h-sky">T</div>
    <div style="flex-grow: 1;"><div class="display" style="font-size: 19px; font-weight: 700;">Travel 2027</div><div style="font-size: 13px; color: var(--text-2);">5 here</div></div>
  </div>
  <div class="transcript">
    <div class="who" style="margin-left: 40px;">Lena</div>
    <div class="msg"><span class="av sm h-rose" style="visibility: hidden;">L</span><div class="bubble"><div class="img" role="img" aria-label="Photo from Lena, 18:02"></div>The apartment balcony!</div></div>
    <div class="msg"><span class="av sm h-rose">L</span><div class="bubble chit"><div class="ph"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 15l-5-5-8 9"></path></svg>Photo · 4.8 MB<button class="btn ghost sm" style="min-height: 36px;">Show</button></div>Kitchen view <span class="t">18:03</span></div></div>
    <div class="msg mine" style="margin-top: 8px;"><div class="bubble chit"><div class="file"><span class="fi">PDF</span><div style="flex-grow: 1; min-width: 0;"><div style="font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">train-tickets-lisb…n.pdf</div><div style="font-size: 12px; color: var(--text-2);">PDF · 312 KB</div></div></div>
      <div style="display: flex; gap: 6px; margin: 0 -6px 4px;"><button class="btn ghost sm" style="min-height: 36px;">Open</button><button class="btn ghost sm" style="min-height: 36px;">Save</button></div>Tickets for everyone <span class="t">18:05</span></div></div>
  </div>
  <div class="card" role="status">
    <span class="ring" aria-hidden="true"></span>
    <div style="flex-grow: 1; min-width: 0;"><div style="font-weight: 600; font-size: 14px;">IMG_2041.jpg</div><div style="font-size: 12px; color: var(--text-2);">Sending 1.2 of 3.4 MB</div></div>
    <button class="btn text sm">Cancel</button>
  </div>
  <div class="composer">
    <div class="field"><span class="v filled">Sunset from the castle</span>
      <button class="icon-btn" aria-label="Attach" style="width: 40px; height: 40px;"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.2-8.2a3.4 3.4 0 0 1 4.8 4.8l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.6-7.6"></path></svg></button></div>
    <button class="send off" aria-label="Sending"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
