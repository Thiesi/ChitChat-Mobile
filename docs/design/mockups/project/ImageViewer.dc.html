<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.scrim{background:rgba(0,0,0,0.55)}</style>
</helmet>
<div class="ccm dark" style="background: #000000;">
  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 32px 4px 8px; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.55); z-index: 2;">
    <a class="icon-btn" href="RoomFiles.dc.html" aria-label="Close viewer" style="color: #F2EDF7;"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; color: #F2EDF7;"><div style="font-weight: 600;">Lena</div><div style="font-size: 12px; color: #A79FB4;">Today 18:02 · Travel 2027</div></div>
    <button class="icon-btn" aria-label="Save" style="color: #F2EDF7;"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
    <button class="icon-btn" aria-label="Share" style="color: #F2EDF7;"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="18.5" r="2.5"></circle><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"></path></svg></button>
  </div>
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <div role="img" aria-label="Photo from Lena, today 18:02: The apartment balcony!" style="width: 390px; height: 292px; background: linear-gradient(135deg,#7FD1C1,#8DB8F5 60%,#F5C451);"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 28px; background: rgba(0,0,0,0.55); color: #F2EDF7;">
    <div style="font-size: 15px;">The apartment balcony!</div>
    <div style="display: flex; gap: 8px; margin-top: 12px;">
      <button class="btn ghost sm" style="color: #F2EDF7; border-color: #7D7490;" aria-label="Zoom out">−</button>
      <button class="btn ghost sm" style="color: #F2EDF7; border-color: #7D7490;" aria-label="Zoom in">+</button>
      <button class="btn ghost sm" style="color: #F2EDF7; border-color: #7D7490;">Reset zoom</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
