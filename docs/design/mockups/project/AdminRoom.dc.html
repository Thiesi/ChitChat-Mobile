<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin message actions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lantern.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ccm light">
  <div class="inset"></div>
  <div class="appbar" style="padding-left: 4px; gap: 8px; border-bottom: 1px solid var(--line);">
    <a class="icon-btn" href="Home.dc.html" aria-label="Back to rooms"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="tile sm h-apricot">G</div>
    <div style="flex-grow: 1; min-width: 0;">
      <div class="display" style="font-size: 19px; font-weight: 700;">General</div>
      <div style="font-size: 13px; color: var(--text-2);"><b style="color: var(--text);">6 here</b> · 1 guest</div>
    </div>
  </div>
  <div class="transcript" style="justify-content: flex-start; padding-top: 16px;">
    <div class="who" style="margin-left: 40px;">Max</div>
    <div class="msg"><span class="av sm h-sea">M</span><div class="bubble chit">Router finally works again <span class="t">19:10</span></div></div>
    <div class="who" style="margin-left: 40px;">visitor_7 <span class="role guest">GUEST</span></div>
    <div class="msg"><span class="av sm" style="background: var(--raised); color: var(--text-2); border: 1.5px dashed var(--field-line);">V</span>
      <div class="bubble chit" style="box-shadow: 0 0 0 3px var(--persimmon);">check out my channel, link in bio, cheap followers <span class="t">19:12</span></div></div>
  </div>

  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Message actions">
    <div class="grab"></div>
    <div style="display: flex; justify-content: space-around; padding: 0 16px 10px;">
      <button class="react" style="min-height: 48px; min-width: 48px; justify-content: center; font-size: 20px;" aria-label="React thumbs up">👍</button>
      <button class="react" style="min-height: 48px; min-width: 48px; justify-content: center; font-size: 20px;" aria-label="React heart">❤️</button>
      <button class="react" style="min-height: 48px; min-width: 48px; justify-content: center; font-size: 20px;" aria-label="React laughing">😂</button>
      <button class="react" style="min-height: 48px; min-width: 48px; justify-content: center; font-size: 20px;" aria-label="React surprised">😮</button>
      <button class="react" style="min-height: 48px; min-width: 48px; justify-content: center; font-size: 20px;" aria-label="React sad">😢</button>
      <button class="react" style="min-height: 48px; min-width: 48px; justify-content: center; font-size: 20px;" aria-label="React celebrate">🎉</button>
    </div>
    <div class="sheet-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 8L5 12l5 4M5 12h9a5 5 0 0 1 5 5v1"></path></svg>Reply</div>
    <div class="sheet-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>Copy text</div>
    <div class="sheet-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>Report</div>
    <div style="margin: 6px 24px 2px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--dusk); letter-spacing: 0.04em; display: flex; gap: 6px; align-items: center;">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 2.4;"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>AS ADMIN</div>
    <div class="sheet-item" style="color: var(--dusk);"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3"></path></svg>Delete for everyone…</div>
    <div class="sheet-item" style="color: var(--dusk);"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM17 9l4 6M21 9l-4 6"></path></svg>Mute in this room…</div>
    <div class="sheet-item" style="color: var(--dusk);"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5M10 16l-4-4 4-4M6 12h10"></path></svg>End this guest's visit…</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</script>
</body>
</html>
