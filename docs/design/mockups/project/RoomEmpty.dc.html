<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty room</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lantern.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ccm light">
  <div class="inset"></div>
  <div class="appbar" style="padding-left: 4px; gap: 8px; border-bottom: 1px solid var(--line);">
    <a class="icon-btn" href="Home.dc.html" aria-label="Back to rooms"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="tile sm h-lilac">B</div>
    <div style="flex-grow: 1; min-width: 0;">
      <div class="display" style="font-size: 19px; font-weight: 700;">Board games</div>
      <div style="font-size: 13px; color: var(--text-2);">Just you here · 3 members</div>
    </div>
    <button class="icon-btn" aria-label="Room details"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="1.3"></circle><circle cx="12" cy="12" r="1.3"></circle><circle cx="12" cy="18.5" r="1.3"></circle></svg></button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 36px; text-align: center;">
    <svg width="112" height="96" viewBox="0 0 112 96" aria-hidden="true">
      <rect x="10" y="10" width="76" height="62" rx="26" fill="none" stroke="#8C8299" stroke-width="3" stroke-dasharray="7 7"></rect>
      <circle cx="94" cy="80" r="9" fill="#F06A3B"></circle>
    </svg>
    <h2 class="display" style="margin: 0; font-size: 26px; font-weight: 800; line-height: 1.15;">It's quiet in here.</h2>
    <p style="margin: 0; color: var(--text-2); font-size: 15px;">Say the first thing. Everyone who comes into Board games will see it, even if they arrive later.</p>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
      <button class="btn ghost sm">Hi everyone!</button>
      <button class="btn ghost sm">Who's in on Friday?</button>
    </div>
    <div class="hint">Tapping a suggestion puts it in the message box. Nothing is sent until you press Send.</div>
  </div>

  <div class="composer">
    <div class="field" style="border: 2px solid var(--persimmon);"><span class="v filled">Who's in on Friday?</span></div>
    <button class="send" aria-label="Send"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
