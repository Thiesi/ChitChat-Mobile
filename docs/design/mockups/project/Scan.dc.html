<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan an invite code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lantern.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.vf{position:absolute;width:44px;height:44px;border-color:#FFB547;border-style:solid;border-width:0}
</style>
</helmet>
<div class="ccm dark">
  <div class="inset"></div>
  <div class="appbar" style="padding-left: 4px; gap: 8px;">
    <a class="icon-btn" href="OnboardServer.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 class="display" style="font-size: 22px;">Scan an invite code</h1>
  </div>
  <div style="position: relative; margin: 8px 16px 0; height: 420px; border-radius: 28px; overflow: hidden; background: #2A2633;" aria-label="Camera preview">
    <div style="position: absolute; inset: 0; background: radial-gradient(circle at 40% 35%, #4A4357 0%, #241F2D 70%);"></div>
    <div style="position: absolute; left: 70px; top: 85px; width: 218px; height: 218px;">
      <div class="vf" style="left: 0; top: 0; border-left-width: 4px; border-top-width: 4px; border-top-left-radius: 18px;"></div>
      <div class="vf" style="right: 0; top: 0; border-right-width: 4px; border-top-width: 4px; border-top-right-radius: 18px;"></div>
      <div class="vf" style="left: 0; bottom: 0; border-left-width: 4px; border-bottom-width: 4px; border-bottom-left-radius: 18px;"></div>
      <div class="vf" style="right: 0; bottom: 0; border-right-width: 4px; border-bottom-width: 4px; border-bottom-right-radius: 18px;"></div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; color: #F2EDF7; font-size: 15px;">Point your camera at the code</div>
  </div>
  <div class="strip warn" role="status" style="margin: 14px 16px 0; border-radius: 16px; font-size: 14px;">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; width: 20px; height: 20px;"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 8v5M12 16v.01"></path></svg>
    <span>This QR code isn't a ChitChat invite.</span>
  </div>
  <span class="spacer"></span>
  <div style="padding: 0 24px 28px; display: flex; flex-direction: column; gap: 10px;">
    <button class="btn ghost"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M20.5 15l-5-5-8 9"></path></svg>Choose from photos</button>
    <a class="btn text" href="OnboardServer.dc.html">Type the address instead</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
