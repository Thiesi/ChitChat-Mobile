name: Native input observation (not a merge gate)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-input-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  traced-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: State the diagnostic boundary
        run: |
          echo 'Diagnostic only: one opt-in traced 100-cycle fixture. No retries. Not the full native merge gate.'
          echo "Observed source commit: $GITHUB_SHA"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/native_input_observation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-input-observation-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/nativeInputObservation/
