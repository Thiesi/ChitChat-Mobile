name: Native input observation (not a merge gate)
run-name: ${{ inputs.reproducer_arm != 'none' && inputs.reproducer_arm != '' && format('IME reproducer arm {0} (measurement only)', inputs.reproducer_arm) || 'Native input observation (not a merge gate)' }}

on:
  workflow_dispatch:
    inputs:
      reproducer_arm:
        description: Separate issue69 50-case arm (none retains the original 100-cycle control)
        type: choice
        options: [none, a, b, c]
        default: none
        required: true
      a3_probe:
        description: 'DIAGNOSTIC branch only (#378): the A3 proof run, observation only'
        type: choice
        options: [none, run]
        default: none
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.a3_probe == 'run' && format('a3-probe-{0}', github.ref) || inputs.reproducer_arm != 'none' && inputs.reproducer_arm != '' && format('ime-reproducer-{0}-{1}', github.ref, inputs.reproducer_arm) || format('native-input-observation-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  a3-probe:
    if: inputs.a3_probe == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            image: r9
          - api: 36
            image: r7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: State the diagnostic boundary
        run: |
          echo "Diagnostic only (#378): the A3 proof run, observation only. No retries. Not a merge gate."
          echo "Observed source commit: $GITHUB_SHA"
      - name: Install ffmpeg (the recordings' frames; diagnostic only)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || echo "ffmpeg unavailable"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the pinned system image
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/google_apis/x86_64
          key: emu-img-${{ runner.os }}-${{ runner.arch }}-api${{ matrix.api }}-google_apis-${{ matrix.image }}-emu16740729
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          NATIVE_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-build: '16740729'
          disable-animations: true
          pre-emulator-launch-script: python3 -B .github/scripts/pin_journey_image.py
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/native_environment.py
            adb logcat -G 16M || true; ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagTextFirstOff,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagTextFirstOn,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagKeyboardFirstOff,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagKeyboardFirstOn,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagLandscapeOff,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagLandscapeOn,io.github.thiesi.chitchat.feature.reports.ReportNoticeViewportTest#diagNoticeOff,io.github.thiesi.chitchat.feature.reports.ReportNoticeViewportTest#diagNoticeOn,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagInterruptedOn,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagReversedOn,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagCancelledOn,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagKeyboardFirst100Off,io.github.thiesi.chitchat.feature.reports.ReportFormLayoutTest#diagLandscape100Off -Pandroid.testInstrumentationRunnerArguments.a3Probe=run -Pandroid.testInstrumentationRunnerArguments.expectSoftKeyboard=true --max-workers=2; s=$?; echo "diagnostic gradle exit $s"; for k in window_animation_scale transition_animation_scale animator_duration_scale; do echo "after the run: $k=$(adb shell settings get global $k)"; done; mkdir -p app/build/ccm-recording app/build/ccm-device-output; for n in textfirst keyboardfirst landscape notice interrupted reversed cancelled; do for m in on off; do adb pull /data/local/tmp/ccm-a3-$n-$m.mp4 app/build/ccm-recording/ || true; for p in first-arrival-end first-hide-end arrival-end hide-end case-end; do adb pull /data/local/tmp/ccm-cap-ccm-a3-$n-$m-$p.png app/build/ccm-recording/ 2>/dev/null || true; done; done; done; adb logcat -d -s CCMKeepProbe > app/build/ccm-device-output/a3-probe.txt || true; adb logcat -d -s CCMDiagScales > app/build/ccm-device-output/scales-logcat.txt || true; for n in textfirst keyboardfirst landscape notice interrupted reversed cancelled; do for m in on off; do v=app/build/ccm-recording/ccm-a3-$n-$m.mp4; if [ -f "$v" ]; then mkdir -p app/build/ccm-recording/$n-$m-frames; ffmpeg -loglevel error -i "$v" -vsync 0 app/build/ccm-recording/$n-$m-frames/f%05d.png || true; ffprobe -loglevel error -select_streams v -show_entries frame=pts_time -of csv=p=0 "$v" > app/build/ccm-recording/$n-$m-frame-times.csv || true; fi; done; done; exit $s
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a3-chosen-api${{ matrix.api }}
          retention-days: 7
          path: |
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/ccm-recording/
            app/build/ccm-device-output/

  a3-baseline:
    if: inputs.a3_probe == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            image: r9
          - api: 36
            image: r7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: diag/a3-notice-main
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: State the diagnostic boundary
        run: |
          echo "Diagnostic only (#378): the A3 proof run, observation only. No retries. Not a merge gate."
          echo "Observed source commit: $GITHUB_SHA"
      - name: Install ffmpeg (the recordings' frames; diagnostic only)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || echo "ffmpeg unavailable"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the pinned system image
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/google_apis/x86_64
          key: emu-img-${{ runner.os }}-${{ runner.arch }}-api${{ matrix.api }}-google_apis-${{ matrix.image }}-emu16740729
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          NATIVE_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-build: '16740729'
          disable-animations: true
          pre-emulator-launch-script: python3 -B .github/scripts/pin_journey_image.py
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/native_environment.py
            adb logcat -G 16M || true; ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.thiesi.chitchat.feature.reports.ReportNoticeViewportTest#diagNoticeOff,io.github.thiesi.chitchat.feature.reports.ReportNoticeViewportTest#diagNoticeOn -Pandroid.testInstrumentationRunnerArguments.a3Probe=run -Pandroid.testInstrumentationRunnerArguments.expectSoftKeyboard=true --max-workers=2; s=$?; echo "diagnostic gradle exit $s"; for k in window_animation_scale transition_animation_scale animator_duration_scale; do echo "after the run: $k=$(adb shell settings get global $k)"; done; mkdir -p app/build/ccm-recording app/build/ccm-device-output; for n in textfirst keyboardfirst landscape notice interrupted reversed cancelled; do for m in on off; do adb pull /data/local/tmp/ccm-a3-$n-$m.mp4 app/build/ccm-recording/ || true; for p in first-arrival-end first-hide-end arrival-end hide-end case-end; do adb pull /data/local/tmp/ccm-cap-ccm-a3-$n-$m-$p.png app/build/ccm-recording/ 2>/dev/null || true; done; done; done; adb logcat -d -s CCMKeepProbe > app/build/ccm-device-output/a3-probe.txt || true; adb logcat -d -s CCMDiagScales > app/build/ccm-device-output/scales-logcat.txt || true; for n in textfirst keyboardfirst landscape notice interrupted reversed cancelled; do for m in on off; do v=app/build/ccm-recording/ccm-a3-$n-$m.mp4; if [ -f "$v" ]; then mkdir -p app/build/ccm-recording/$n-$m-frames; ffmpeg -loglevel error -i "$v" -vsync 0 app/build/ccm-recording/$n-$m-frames/f%05d.png || true; ffprobe -loglevel error -select_streams v -show_entries frame=pts_time -of csv=p=0 "$v" > app/build/ccm-recording/$n-$m-frame-times.csv || true; fi; done; done; exit $s
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a3-baseline-api${{ matrix.api }}
          retention-days: 7
          path: |
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/ccm-recording/
            app/build/ccm-device-output/

  traced-control:
    if: (inputs.reproducer_arm == 'none' || inputs.reproducer_arm == '') && inputs.a3_probe != 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: State the diagnostic boundary
        run: |
          echo 'Diagnostic only: one opt-in traced 100-cycle fixture. No retries. Not the full native merge gate.'
          echo "Observed source commit: $GITHUB_SHA"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/native_input_observation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-input-observation-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/nativeInputObservation/

  standalone-reproducer:
    if: contains(fromJSON('["a","b","c"]'), inputs.reproducer_arm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPRODUCER_ARM: ${{ inputs.reproducer_arm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build standalone APKs and verify signatures (no instrumentation)
        run: |
          ./gradlew -PimeReproducer=true :ime-reproducer:assembleDebug :ime-reproducer:assembleDebugAndroidTest --max-workers=2
          python3 -B .github/scripts/ime_reproducer.py prepare
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ inputs.reproducer_arm == 'b' && 35 || 36 }}
          target: google_apis
          arch: x86_64
          emulator-build: '16740729'
          cores: ${{ inputs.reproducer_arm == 'c' && 4 || 2 }}
          ram-size: ${{ inputs.reproducer_arm == 'c' && '4096M' || '' }}
          disable-animations: true
          pre-emulator-launch-script: python3 -B .github/scripts/pin_reproducer_image.py
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/ime_reproducer.py run "$REPRODUCER_ARM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ime-reproducer-${{ inputs.reproducer_arm }}-measurement-only
          retention-days: 7
          path: ime-reproducer/build/reports/observation/
