name: Native input observation (not a merge gate)
run-name: ${{ inputs.reproducer_arm != 'none' && inputs.reproducer_arm != '' && format('IME reproducer arm {0} (measurement only)', inputs.reproducer_arm) || 'Native input observation (not a merge gate)' }}

on:
  workflow_dispatch:
    inputs:
      reproducer_arm:
        description: Separate issue69 50-case arm (none retains the original 100-cycle control)
        type: choice
        options: [none, a, b, c]
        default: none
        required: true
      scroll_diagnostic:
        description: 'DIAGNOSTIC branch only (#351/#369): one scroll-settle form, N=40, observation only'
        type: choice
        options: [none, auth, report, report-both]
        default: none
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.scroll_diagnostic != 'none' && format('scroll-settle-{0}-{1}', github.ref, inputs.scroll_diagnostic) || inputs.reproducer_arm != 'none' && inputs.reproducer_arm != '' && format('ime-reproducer-{0}-{1}', github.ref, inputs.reproducer_arm) || format('native-input-observation-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  traced-control:
    if: (inputs.reproducer_arm == 'none' || inputs.reproducer_arm == '') && inputs.scroll_diagnostic == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: State the diagnostic boundary
        run: |
          echo 'Diagnostic only: one opt-in traced 100-cycle fixture. No retries. Not the full native merge gate.'
          echo "Observed source commit: $GITHUB_SHA"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/native_input_observation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-input-observation-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/nativeInputObservation/

  scroll-settle:
    if: contains(fromJSON('["auth","report","report-both"]'), inputs.scroll_diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NATIVE_API: '35'
      FORM: ${{ inputs.scroll_diagnostic }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: State the diagnostic boundary
        run: |
          echo "Diagnostic only (#351/#369): one scroll-settle form ($FORM), 40 fresh repetitions, observation only. No retries. Not a merge gate."
          echo "Observed source commit: $GITHUB_SHA"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the pinned API35 system image
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: emu-img-${{ runner.os }}-${{ runner.arch }}-api35-google_apis-r9-emu16740729
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-build: '16740729'
          disable-animations: true
          pre-emulator-launch-script: python3 -B .github/scripts/pin_journey_image.py
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/native_environment.py
            if [ "$FORM" = auth ]; then CLASS=io.github.thiesi.chitchat.feature.auth.AuthPinnedPresentationTest; else CLASS=io.github.thiesi.chitchat.feature.reports.ReportPresentationTest; fi; ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=$CLASS#scrollSettleDiagnostic -Pandroid.testInstrumentationRunnerArguments.scrollSettleDiagnostic=$FORM -Pandroid.testInstrumentationRunnerArguments.expectSoftKeyboard=true --max-workers=2; s=$?; echo "diagnostic gradle exit $s"; mkdir -p app/build/ccm-device-output; for p in de.networkxxiii.chitchat.debug.test de.networkxxiii.chitchat.debug; do adb pull /sdcard/Android/media/$p/additional_test_output app/build/ccm-device-output/$p || true; done; exit $s
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scroll-settle-${{ inputs.scroll_diagnostic }}-diagnostic
          retention-days: 7
          # reports/androidTests includes native_environment.py's device/ health verdict.
          path: |
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/
            app/build/ccm-device-output/

  standalone-reproducer:
    if: contains(fromJSON('["a","b","c"]'), inputs.reproducer_arm) && inputs.scroll_diagnostic == 'none'

    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPRODUCER_ARM: ${{ inputs.reproducer_arm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build standalone APKs and verify signatures (no instrumentation)
        run: |
          ./gradlew -PimeReproducer=true :ime-reproducer:assembleDebug :ime-reproducer:assembleDebugAndroidTest --max-workers=2
          python3 -B .github/scripts/ime_reproducer.py prepare
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ inputs.reproducer_arm == 'b' && 35 || 36 }}
          target: google_apis
          arch: x86_64
          emulator-build: '16740729'
          cores: ${{ inputs.reproducer_arm == 'c' && 4 || 2 }}
          ram-size: ${{ inputs.reproducer_arm == 'c' && '4096M' || '' }}
          disable-animations: true
          pre-emulator-launch-script: python3 -B .github/scripts/pin_reproducer_image.py
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/ime_reproducer.py run "$REPRODUCER_ARM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ime-reproducer-${{ inputs.reproducer_arm }}-measurement-only
          retention-days: 7
          path: ime-reproducer/build/reports/observation/
