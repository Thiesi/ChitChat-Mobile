name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test native gate diagnostics without credentials or a device
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build, unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --max-workers=2
      - name: Compile the opt-in standalone diagnostic (no device invocation)
        run: ./gradlew -PfocusDiagnostic=true :focus-diagnostic:assembleDebug --max-workers=2
      - name: Compile the opt-in recreated-insets diagnostic (no instrumentation)
        run: ./gradlew -PrecreatedInsetsDiagnostic=true :app:assembleDebugAndroidTest --max-workers=2
      - name: Build and unit-test the opt-in IME reproducer (no instrumentation)
        run: |
          ./gradlew -PimeReproducer=true :ime-reproducer:assembleDebug :ime-reproducer:assembleDebugAndroidTest :ime-reproducer:testDebugUnitTest :ime-reproducer:lintDebug --max-workers=2
          python3 -B .github/scripts/ime_reproducer.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standalone-ime-reproducer-apks-and-reports
          retention-days: 7
          path: ime-reproducer/build/reports/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chitchat-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chitchat-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-focus-diagnostic-apk
          path: focus-diagnostic/build/outputs/apk/debug/*.apk

  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATIVE_API: '35'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-build: '16740729'
          disable-animations: true
          pre-emulator-launch-script: python3 -B .github/scripts/pin_journey_image.py
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/native_environment.py
            python3 -B .github/scripts/native_presentation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-journey-reports
          path: app/build/reports/androidTests/

  api36-observation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      NATIVE_API: '36'
    outputs:
      disposition: ${{ steps.classify.outputs.disposition }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the original full API36 observation once
        id: native
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-build: '16740729'
          disable-animations: true
          pre-emulator-launch-script: python3 -B .github/scripts/pin_journey_image.py
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/native_environment.py
            python3 -B .github/scripts/native_presentation.py
      - name: Classify and retain the original observation
        id: classify
        if: always()
        env:
          OBSERVATION_OUTCOME: ${{ steps.native.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B .github/scripts/api36_observation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-api36-observation-reports
          retention-days: 7
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: api36-observation-status
          retention-days: 7
          if-no-files-found: error
          path: app/build/reports/androidTests/api36-observation.json

  api36-product-defects:
    if: always() && github.event_name == 'pull_request'
    needs: api36-observation
    runs-on: ubuntu-latest
    steps:
      - name: Block other or incomplete API36 failures
        env:
          DISPOSITION: ${{ needs.api36-observation.outputs.disposition }}
        run: |
          case "$DISPOSITION" in
            passed|known_ime) exit 0 ;;
            *) echo '::error::API36 observation contains an unknown failure or is incomplete. Inspect its original reports; delivery is blocked.'; exit 1 ;;
          esac
