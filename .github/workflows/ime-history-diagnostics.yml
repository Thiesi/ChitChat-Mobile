name: IME history diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/ime-history-diagnostics.yml'
      - '.github/scripts/ime_history_cohorts.py'
      - '.github/scripts/test_ime_history_cohorts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [view-only]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Check diagnostic result validation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 -B .github/scripts/ime_history_cohorts.py '${{ matrix.mode }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ime-history-${{ matrix.mode }}
          path: app/build/reports/ime-history/
