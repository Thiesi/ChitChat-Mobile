name: Report API36 observation

on:
  workflow_run:
    workflows: [Android]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Android PR run to report; never invokes tests
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: api36-report-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: read
    steps:
      # Privileged reporting executes only default-branch code, never the PR checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report bounded original API36 failures on their PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATION_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 -B .github/scripts/report_api36_observation.py
